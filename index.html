<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accunet Services, LLC</title>
<style>
:root {
  --bg:#07111f; --panel:#0e1b2d; --panel2:#13243b; --ink:#f7fbff; --muted:#a9bad0;
  --cyan:#21b8f6; --blue:#3b82f6; --indigo:#7467f0; --green:#34d399; --red:#fb7185;
  --line:rgba(255,255,255,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:
radial-gradient(circle at 18% -10%,rgba(33,184,246,.20),transparent 34rem),
radial-gradient(circle at 88% 12%,rgba(116,103,240,.18),transparent 32rem),
var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:1180px;margin:auto;padding:0 28px}
nav{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;font-weight:800;font-size:1.25rem}
.brand img{width:48px;height:48px;border-radius:10px}
.pill{border:1px solid rgba(33,184,246,.32);background:rgba(33,184,246,.08);padding:8px 13px;border-radius:999px;color:#bcecff;font-size:.84rem;font-weight:700}
.hero{padding:82px 0 64px;display:grid;grid-template-columns:1.08fr .92fr;gap:58px;align-items:center}
.eyebrow{color:#79d7ff;font-weight:800;text-transform:uppercase;letter-spacing:.13em;font-size:.78rem}
h1{font-size:clamp(3rem,7vw,5.7rem);line-height:.94;letter-spacing:-.055em;margin:14px 0 24px}
.gradient{background:linear-gradient(90deg,#8fe5ff,#6da7ff,#9c8cff);-webkit-background-clip:text;color:transparent}
.lede{font-size:1.2rem;color:#c1cede;max-width:670px}
.ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.btn{display:inline-block;text-decoration:none;padding:12px 18px;border-radius:10px;font-weight:800}
.btn.primary{background:linear-gradient(90deg,var(--cyan),var(--indigo));color:white}
.btn.ghost{border:1px solid var(--line);color:white;background:rgba(255,255,255,.035)}
.device-card{background:linear-gradient(145deg,rgba(20,40,66,.95),rgba(9,22,39,.95));border:1px solid rgba(123,211,255,.18);border-radius:26px;padding:24px;box-shadow:0 30px 90px rgba(0,0,0,.35);position:relative;overflow:hidden}
.device-card:after{content:"";position:absolute;width:230px;height:230px;background:rgba(33,184,246,.10);filter:blur(50px);right:-80px;top:-100px;border-radius:50%}
.toprow{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.status{display:flex;gap:9px;align-items:center;color:#b9f7df;font-weight:800;font-size:.85rem}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 15px var(--green)}
.unit{padding:17px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.025);margin-top:12px}
.unithead{display:flex;justify-content:space-between;gap:12px;align-items:center}
.small{font-size:.82rem;color:var(--muted)}
.good{color:#7ce9bd;font-weight:800}
.alert{color:#ff9aad;font-weight:800}
.timeline{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);display:grid;gap:12px}
.event{display:grid;grid-template-columns:72px 1fr;gap:12px;font-size:.88rem;color:#dce7f3}
section{padding:72px 0}
.center{text-align:center;max-width:760px;margin:auto}
h2{font-size:clamp(2rem,4vw,3.2rem);letter-spacing:-.035em;margin:8px 0 16px}
.sub{color:var(--muted);font-size:1.05rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:38px}
.card{background:rgba(14,27,45,.82);border:1px solid var(--line);border-radius:18px;padding:24px;min-height:210px}
.icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(33,184,246,.22),rgba(116,103,240,.22));font-size:1.35rem;margin-bottom:18px}
.card h3{margin:0 0 10px;font-size:1.13rem}
.card p{margin:0;color:var(--muted)}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:38px;align-items:center}
.step{padding:22px 14px;text-align:center;border-radius:16px;background:rgba(14,27,45,.82);border:1px solid var(--line);min-height:145px}
.step strong{display:block;margin:12px 0 5px}
.arrow{text-align:center;color:#6fcfff;font-size:1.4rem}
.callout{margin-top:28px;border:1px solid rgba(52,211,153,.22);background:linear-gradient(120deg,rgba(52,211,153,.08),rgba(33,184,246,.06));border-radius:22px;padding:30px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}
.future{font-size:.8rem;color:#b7c7d9;border:1px solid var(--line);border-radius:999px;padding:6px 10px}
footer{border-top:1px solid var(--line);padding:34px 0 50px;color:var(--muted);font-size:.9rem}
@media(max-width:850px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.flow{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}.callout{grid-template-columns:1fr}}
@media print{body{background:#07111f;-webkit-print-color-adjust:exact;print-color-adjust:exact}nav{display:none}.hero{padding-top:35px}section{padding:35px 0}}
</style>
</head>
<body>
<div class="wrap">
<p>Accunet Technologies, LLC</p></body>
</html>
